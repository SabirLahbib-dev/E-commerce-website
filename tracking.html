<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking page</title>
    <link rel="stylesheet" href="styles/tracking/trackingHeader.css" />
    <link rel="stylesheet" href="styles/tracking/tracking.css" />
  </head>
  <body>
    <!--Header-->
    <header>
      <div class="logo-categoriesLinks-container">
        <button class="hamburger-menu-button">
          <img
            src="images/icons/menu-bar.png"
            alt="menu"
            class="hamburger-menu-icon"
          />
        </button>
        <div class="logo-container">
          <img
            src="images/sabir-logo.png"
            alt="sabir logo"
            class="logo-image"
          />
        </div>
        <ul class="desktop-categories-links">
          <li class="desktop-category-link">WOMEN</li>
          <li class="desktop-category-link">MEN</li>
          <li class="desktop-category-link">HOME</li>
          <li class="desktop-category-link">BEAUTY</li>
        </ul>
      </div>
      <div class="search-bar-container">
        <img src="images/icons/search-icon.png" class="search-icon" />
        <input type="search" placeholder="Search" class="search-bar" />
        <button class="search-button">
          <img src="images/icons/right-arrow.png" class="arrow-icon" />
        </button>
      </div>
      <a href="checkout.html" class="a-link"
        ><div class="cart-quantity">CART(3)</div></a
      >
    </header>
    <!--Sidebar for mobile-->
    <aside class="mobile-side-bar">
      <ul class="mobile-categories-links">
        <li class="mobile-category-link">WOMEN</li>
        <li class="mobile-category-link">MEN</li>
        <li class="mobile-category-link">HOME</li>
        <li class="mobile-category-link">BEAUTY</li>
      </ul>
    </aside>
    <!--Main-->
    <main>
      <a href="orders.html"
        ><button class="back-to-orders-button">
          <img src="images/icons/back.png" class="back-icon" /> BACK TO ORDERS
        </button></a
      >
      <div class="arriving-date">Arriving on Tuesday, July 14</div>
      <div class="order-name">
        Black and Gray Athletic Cotton Socks - 6 Pairs
      </div>
      <div class="order-quantity">Quantity: 1</div>

      <div class="order-image-container">
        <img
          src="images/products/athletic-cotton-socks-6-pairs.jpg"
          class="order-image"
        />
      </div>
      <div class="preparing-Shipped-Delivered-container">
        <span class="current-status-label">PREPARING</span>
        <span>SHIPPED</span>
        <span>DELIVERED</span>
      </div>
      <div class="status-progress-bar">
        <div class="bar" style="width: 19%"></div>
      </div>
    </main>
  </body>
  <script src="scripts/tracking.js" type="module"></script>
</html>
