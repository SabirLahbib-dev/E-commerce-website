<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout page</title>
    <link rel="stylesheet" href="styles/checkout/checkoutHeader.css" />
    <link rel="stylesheet" href="styles/checkout/checkout.css" />
  </head>
  <body>
    <!--Checkout page header-->
    <header class="js-checkout-header">
      <a href="sabir.html" class="sabir-page-link">
        <div class="logo-container">
          <img
            src="images/sabir-logo.png"
            class="logo-image"
            alt="SABIR Logo"
          /></div
      ></a>
      <div class="checkout-quantity-items">
        Checkout (<span class="items-quantity"
          ><a href="sabir.html" class="sabir-page-link"></a></span
        >)
      </div>
      <div><img src="images/icons/checkout-lock-icon.png" /></div>
    </header>

    <!--Main-->
    <main>
      <h2>Review your order</h2>
      <div class="checkout-grid">
        <div class="cart-items-container js-cart-items-container"></div>
        <div class="order-summary js-order-summary"></div>
      </div>
    </main>
  </body>
  <script src="scripts/checkout.js" type="module"></script>
</html>
