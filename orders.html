<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SABIR E-COMMERCE PROJECT - ORDERS</title>
    <link rel="stylesheet" href="styles/Orders/ordersHeader.css" />
    <link rel="stylesheet" href="styles/Orders/orders.css" />
  </head>
  <body>
    <!--Header-->
    <header>
      <div class="logo-categoriesLinks-container">
        <button class="hamburger-menu-button">
          <img
            src="images/icons/menu-bar.png"
            alt="menu"
            class="hamburger-menu-icon"
          />
        </button>
        <div class="logo-container">
          <a href="sabir.html"
            ><img
              src="images/sabir-logo.png"
              alt="sabir logo"
              class="logo-image"
          /></a>
        </div>
        <ul class="desktop-categories-links">
          <li
            class="desktop-category-link js-category-link"
            data-category="women"
          >
            WOMEN
          </li>
          <li
            class="desktop-category-link js-category-link"
            data-category="men"
          >
            MEN
          </li>
          <li
            class="desktop-category-link js-category-link"
            data-category="home"
          >
            HOME
          </li>
          <li
            class="desktop-category-link js-category-link"
            data-category="beauty"
          >
            BEAUTY
          </li>
        </ul>
      </div>
      <div class="search-bar-container">
        <img src="images/icons/search-icon.png" class="search-icon" />
        <input
          type="search"
          placeholder="Search"
          class="search-bar js-search-bar"
        />
        <button class="search-button js-search-button">
          <img src="images/icons/right-arrow.png" class="arrow-icon" />
        </button>
      </div>
      <a href="checkout.html" class="a-link"
        ><div class="cart-quantity js-cart-quantity"></div
      ></a>
    </header>
    <!--Sidebar for mobile-->
    <aside class="mobile-side-bar">
      <ul class="mobile-categories-links">
        <li class="mobile-category-link js-category-link" data-category="women">
          WOMEN
        </li>
        <li class="mobile-category-link js-category-link" data-category="men">
          MEN
        </li>
        <li class="mobile-category-link js-category-link" data-category="home">
          HOME
        </li>
        <li
          class="mobile-category-link js-category-link"
          data-category="beauty"
        >
          BEAUTY
        </li>
      </ul>
    </aside>

    <!-- Orders Grid-->
    <main></main>
  </body>
  <script src="scripts/ordersPage.js" type="module"></script>
</html>
