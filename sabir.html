<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SABIR E-COMMERCE PROJECT</title>
    <link rel="stylesheet" href="styles/sabir/header.css" />
  </head>
  <body>
    <!--Header-->
    <header>
      <div class="logo-categoriesLinks-container">
        <button class="hamburger-menu-button">
          <img
            src="images/icons/menu-bar.png"
            alt="menu"
            class="hamburger-menu-icon"
          />
        </button>
        <div class="logo-container">
          <img
            src="images/sabir-logo.png"
            alt="sabir logo"
            class="logo-image"
          />
        </div>
        <div class="logo-container mobile-logo">
          <img
            src="images/mobile-sabir-logo.png"
            alt="sabir logo"
            class="mobile-logo-image"
          />
        </div>
        <ul class="header-categories-links">
          <li class="women-link">WOMEN</li>
          <li class="men-link">MEN</li>
          <li class="home-link">HOME</li>
          <li class="beauty-link">BEAUTY</li>
        </ul>
      </div>
      <div class="search-bar-container">
        <img src="images/icons/search-icon.png" class="search-icon" />
        <input type="search" placeholder="Search" class="search-bar" />
        <button class="search-button">
          <img src="images/icons/right-arrow.png" class="arrow-icon" />
        </button>
      </div>
      <div class="cart-quantity">CART(3)</div>
    </header>
  </body>
</html>
